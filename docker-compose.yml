services:
  findlink:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: findlink
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - findlink-data:/app/db
    # 512 MB VPS: hard cap slightly under system RAM so the kernel
    # can still breathe; Node heap capped at 384 MB via NODE_OPTIONS.
    mem_limit: 460m
    memswap_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  findlink-data:
